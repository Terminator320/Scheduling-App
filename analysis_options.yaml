# Lint and analysis configuration for the Scheduling App.
#
# Phase 0 of the clean-architecture restructure switched the base from
# `flutter_lints` to `very_good_analysis` for a stricter ruleset. The
# `analyzer.errors` block below downgrades a set of rules to `ignore`
# during the per-feature migration so the build stays green; entries are
# removed phase by phase as features migrate, and the block must be empty
# before the restructure is considered complete.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Generated by build_runner (freezed, json_serializable, riverpod_generator).
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    # Generated by intl/l10n.
    - "lib/l10n/generated/**"
    # Build outputs.
    - "build/**"
    - ".dart_tool/**"

  errors:
    # Migration allow-list — `ignore` only the high-volume style rules that
    # would fail on existing pre-migration code. Each entry should be removed
    # once the corresponding feature has been migrated. Empty this block at
    # the end of the restructure (see plan: "Final" verification task).
    public_member_api_docs: ignore
    lines_longer_than_80_chars: ignore
    prefer_single_quotes: ignore
    avoid_redundant_argument_values: ignore
    cascade_invocations: ignore
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    prefer_const_constructors_in_immutables: ignore
    sort_constructors_first: ignore
    sort_unnamed_constructors_first: ignore
    unnecessary_lambdas: ignore
    use_setters_to_change_properties: ignore
    avoid_positional_boolean_parameters: ignore
    omit_local_variable_types: ignore
    one_member_abstracts: ignore
    flutter_style_todos: ignore
    document_ignores: ignore
    unused_field: ignore
    always_put_required_named_parameters_first: ignore
    always_use_package_imports: ignore
    directives_ordering: ignore
    prefer_int_literals: ignore
    noop_primitive_operations: ignore
    eol_at_end_of_file: ignore
    prefer_relative_imports: ignore
    require_trailing_commas: ignore
    avoid_dynamic_calls: ignore
    sort_pub_dependencies: ignore
    use_string_buffers: ignore
    avoid_catches_without_on_clauses: ignore
    use_super_parameters: ignore
    unawaited_futures: ignore
    avoid_bool_literals_in_conditional_expressions: ignore
    parameter_assignments: ignore
    prefer_final_locals: ignore
    prefer_final_in_for_each: ignore
    prefer_asserts_with_message: ignore
    cast_nullable_to_non_nullable: ignore
    avoid_setters_without_getters: ignore
    no_default_cases: ignore
    use_build_context_synchronously: ignore
    discarded_futures: ignore
    use_decorated_box: ignore
    use_colored_box: ignore
    avoid_classes_with_only_static_members: ignore
    type_annotate_public_apis: ignore
    use_if_null_to_convert_nulls_to_bools: ignore
    use_named_constants: ignore
    unnecessary_raw_strings: ignore
    strict_raw_type: ignore
    non_constant_identifier_names: ignore
    inference_failure_on_function_return_type: ignore
    inference_failure_on_function_invocation: ignore
    inference_failure_on_instance_creation: ignore
    unnecessary_breaks: ignore
    deprecated_member_use: ignore
    use_late_for_private_fields_and_variables: ignore
    unused_import: ignore
    unnecessary_await_in_return: ignore
    prefer_if_elements_to_conditional_expressions: ignore
    file_names: ignore
    avoid_catching_errors: ignore
