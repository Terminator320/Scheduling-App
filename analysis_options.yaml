# Lint and analysis configuration for the Scheduling App.
#
# Uses `very_good_analysis` as the strict baseline. The temporary
# `analyzer.errors:` allow-list from the clean-architecture restructure has
# been emptied — features are now expected to comply with the full ruleset.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Generated by build_runner (freezed, json_serializable, riverpod_generator).
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    # Generated by intl/l10n.
    - "lib/l10n/generated/**"
    # Build outputs.
    - "build/**"
    - ".dart_tool/**"
