name: scheduling
description: "Paul App"
publish_to: 'none'

version: 1.3.0+8

environment:
  sdk: ^3.10.7
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_core_platform_interface: ^7.0.1
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_app_check: ^0.4.3
  firebase_crashlytics: ^5.0.0
  cloud_functions: ^6.0.0

  # Calendar / dates / i18n
  table_calendar: ^3.2.0
  intl: ^0.20.2

  # State management (Riverpod)
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Models (codegen â€” generated by build_runner from dev_dependencies)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.5.0

  # Local storage / paths
  shared_preferences: ^2.5.5
  path: ^1.9.1
  path_provider: ^2.1.5

  # Images
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1

  # Network / external launches
  url_launcher: ^6.3.2
  http: ^1.6.0

  # IDs
  uuid: ^4.5.1

  # Config
  flutter_dotenv: ^6.0.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0
  flex_color_picker: ^3.8.0
  font_awesome_flutter: ^11.0.0


  # App / device info
  package_info_plus: ^10.1.0

  # Native splash (preserve/remove API used in main.dart)
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.3.1
  infinite_scroll_pagination: ^5.1.1
  smooth_page_indicator: ^2.0.1
  permission_handler: ^12.0.2
  local_auth: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint
  very_good_analysis: ^10.2.0
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^3.0.6
  json_serializable: ^6.9.0
  riverpod_generator: '>=4.0.2 <4.0.4'

  # Testing
  mocktail: ^1.0.4

  # Dev-only preview tooling â€” kept here so it isn't bundled in release.
  # Import behind `if (kDebugMode)` if added to main.dart.
  device_preview: ^1.3.1

  # Launcher icon generator (run: `dart run flutter_launcher_icons`)
  flutter_launcher_icons: ^0.14.4

  fake_async: any
flutter:
  generate: true
  uses-material-design: true

  assets:
    - dev/.env
    - assets/images/logo_splash.png
  # TODO(ios): bump bundle id from com.example.scheduling once Android applicationId is finalized; keep both in sync.

# Native splash config â€” consumed by `dart run flutter_native_splash:create`.
# Brand color #005CC8 matches AppColors.primary (lib/core/theme/design_tokens.dart).
flutter_native_splash:
  color: "#005CC8"
  image: assets/images/logo_splash.png
  color_dark: "#0A1633"
  image_dark: assets/images/logo_splash.png

  android_12:
    color: "#005CC8"
    image: assets/images/logo_splash.png
    color_dark: "#0A1633"
    image_dark: assets/images/logo_splash.png

  android: true
  ios: true
  web: false

  ios_content_mode: center

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"
