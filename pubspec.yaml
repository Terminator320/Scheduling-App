name: scheduling
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_core_platform_interface: ^6.0.3
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_app_check: ^0.4.3
  firebase_crashlytics: ^5.0.0

  # Calendar / dates / i18n
  table_calendar: ^3.2.0
  intl: ^0.20.2

  # State management (Riverpod)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Models (codegen — generated by build_runner from dev_dependencies)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.5.0

  # Local storage / paths
  shared_preferences: ^2.5.5
  path: ^1.9.1
  path_provider: ^2.1.5

  # Images
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1

  # Network / external launches
  url_launcher: ^6.3.2
  http: ^1.6.0

  # Config
  flutter_dotenv: ^6.0.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  animations: ^2.2.0
  flex_color_picker: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint
  very_good_analysis: ^6.0.0
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^3.0.6
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.5

  # Testing
  mocktail: ^1.0.4

  # Dev-only preview tooling — kept here so it isn't bundled in release.
  # Import behind `if (kDebugMode)` if added to main.dart.
  device_preview: ^1.3.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - dev/.env
    - assets/images/george.JPG
    - assets/images/logo.jpg
    - assets/images/logo1.png
