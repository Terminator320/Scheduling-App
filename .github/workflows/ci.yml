name: CI

on:
  push:
    # `redesgin` is the long-lived active branch and carries dozens of commits
    # between merges, so main-only push triggers meant most work was unverified
    # until PR time. Both are listed rather than using a wildcard: a wildcard
    # would double every PR run (once for the push, once for the PR).
    branches: [main, redesgin]
  pull_request:

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned so a new "latest stable" release can't break CI on an
          # unrelated push. Bump deliberately; keep >= pubspec's flutter floor.
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Bootstrap dev/.env from template
        run: cp dev/.env.example dev/.env

      - name: Install dependencies
        run: flutter pub get

      # pubspec.yaml sets `generate: true`, so pub get already runs gen-l10n;
      # run it explicitly anyway so a stale tool cache can't skip it.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      # `--coverage` so an untested unit is visible in the run's artifacts
      # rather than only discoverable by a manual audit. No threshold is
      # enforced: a hard gate on a repo with device-only paths (image picker,
      # biometrics, geolocator) would fail on code that is deliberately
      # untestable here.
      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  functions:
    name: Cloud Functions lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches "engines.node" in functions/package.json.
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Same reasoning as the Flutter side: report coverage, don't gate on it.
      # The modules that resolve a Storage bucket at load can't be required by
      # jest at all, which is why their logic lives in pure `*_policy.js`
      # siblings — a threshold here would punish that split.
      - name: Test
        run: npx jest --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage/lcov.info
          if-no-files-found: warn
